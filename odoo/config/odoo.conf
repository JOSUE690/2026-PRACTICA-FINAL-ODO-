[options]
; ---------------------------------------------------------------
; Configuración del entorno de evaluación - Programación II (UTE)
; Este archivo se monta dentro del contenedor en /etc/odoo/odoo.conf
; NO es necesario modificarlo para resolver el examen.
; ---------------------------------------------------------------

; Contraseña maestra (se pide al crear la base de datos desde el navegador)
admin_passwd = ute2026

; Conexión a PostgreSQL (servicio "db" del docker-compose)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Rutas: /mnt/extra-addons es el volumen ./addons del proyecto
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Gestor de bases de datos visible (crear / duplicar / eliminar desde la web)
list_db = True

; Logs
log_level = info

; Límites amplios para evitar cortes al depurar
limit_time_cpu = 600
limit_time_real = 1200
