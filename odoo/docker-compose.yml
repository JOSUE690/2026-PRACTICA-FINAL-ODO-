version: "3.8"

# Entorno de evaluación - Programación II (UTE)
# Levanta Odoo 19 + PostgreSQL 16 listos para trabajar.
# El estudiante SOLO debe escribir código dentro de ./addons/ute_academico
#
#   docker-compose up -d
#   http://localhost:8069
#
services:
  db:
    image: postgres:16
    container_name: ute_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    container_name: ute_odoo
    depends_on:
      - db
    # --dev=xml recarga las vistas XML sin tener que actualizar el módulo
    command: odoo --dev=xml
    ports:
      - "8069:8069"      # interfaz web
      - "8072:8072"      # longpolling / websocket
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo-data:/var/lib/odoo          # filestore (adjuntos, imágenes)
      - ./config:/etc/odoo               # odoo.conf
      - ./addons:/mnt/extra-addons       # <-- AQUÍ va tu módulo
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
