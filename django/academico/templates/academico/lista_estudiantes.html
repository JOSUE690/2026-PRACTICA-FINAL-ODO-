<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de estudiantes</title>
</head>
<body>
    <h1>Estudiantes</h1>
    <ul>
        {% for estudiante in estudiantes %}
            <li>
                <a href="{% url 'detalle_estudiante' estudiante.pk %}">{{ estudiante.name }}</a>
                - {{ estudiante.cedula }}
            </li>
        {% empty %}
            <li>No hay estudiantes registrados.</li>
        {% endfor %}
    </ul>
</body>
</html>
